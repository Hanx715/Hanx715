<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoreline Predator - Final Stable</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a192f;
            --accent-color: #64ffda;
            --cp-color: #bd93f9;
            --text-color: #e6f1ff;
            --glass-bg: rgba(17, 34, 64, 0.9);
            --font-main: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            height: 85px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; background: rgba(10, 25, 47, 0.98);
            border-bottom: 1px solid rgba(100, 255, 218, 0.2); z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo-container img { height: 45px; filter: drop-shadow(0 0 5px var(--accent-color)); }
        .dashboard-title { font-size: 1.6rem; font-weight: 800; letter-spacing: 4px; color: #fff; text-transform: uppercase;}
        
        .total-box { text-align: right; }
        .total-label { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; margin-bottom: 2px;}
        .total-value { font-size: 2.8rem; font-weight: 800; color: var(--accent-color); line-height: 0.9; text-shadow: 0 0 15px rgba(100, 255, 218, 0.2);}

        /* GRID */
        main {
            flex: 1; 
            padding: 15px 2px;
            display: grid; 
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 4px; 
            align-content: start;
            overflow: hidden;
        }

        .column { display: flex; flex-direction: column; gap: 6px; } 

        /* CARDS */
        .agent-card {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass-bg);
            border-left: 2px solid rgba(100, 255, 218, 0.1);
            border-radius: 4px; 
            padding: 0 8px;
            height: 5.0vh; /* Altura ajustada para 15 filas */
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* RANGO */
        .rank { 
            font-size: 1.1rem; 
            font-weight: 800; 
            width: 35px; 
            color: rgba(255,255,255,0.15); 
            text-align: left; 
        }
        
        .agent-info { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-left: 5px; overflow: hidden; }
        .agent-name { font-size: 0.75rem; font-weight: 600; color: #fff; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; margin-bottom: 1px; }
        .agent-cp-display { font-size: 0.95rem; color: var(--cp-color); font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
        .scores-container { text-align: right; min-width: 30px; }
        .agent-score { font-size: 1.4rem; font-weight: 800; color: var(--accent-color); line-height: 1; }
        
        /* TOP 3 */
        .rank-1 { background: linear-gradient(90deg, rgba(255, 215, 0, 0.08), transparent); border-left: 2px solid #ffd700; }
        .rank-2 { background: linear-gradient(90deg, rgba(192, 192, 192, 0.08), transparent); border-left: 2px solid #c0c0c0; }
        .rank-3 { background: linear-gradient(90deg, rgba(205, 127, 50, 0.08), transparent); border-left: 2px solid #cd7f32; }
        .rank-1 .rank { color: #ffd700; } .rank-2 .rank { color: #c0c0c0; } .rank-3 .rank { color: #cd7f32; }

        /* OVERLAY */
        #celebration-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 25, 47, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
            backdrop-filter: blur(10px);
        }
        #celebration-overlay.active { opacity: 1; }
        
        .celeb-title { font-size: 2rem; color: #fff; letter-spacing: 8px; margin-bottom: 20px; text-transform: uppercase;}
        .celeb-name { font-size: 5rem; font-weight: 900; margin-bottom: 20px; text-align: center; line-height: 1.1;}
        .celeb-detail { 
            font-size: 3rem; font-weight: 700; padding: 10px 40px; 
            border: 2px solid; border-radius: 50px; background: rgba(0,0,0,0.3);
            box-shadow: 0 0 20px inset;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="Shoreline.ico" alt="Logo" onerror="this.style.display='none'">
            <span class="dashboard-title">SHORELINE</span>
        </div>
        <div class="total-box">
            <div class="total-label">TOTAL VENTAS</div>
            <div class="total-value" id="grand-total">0</div>
        </div>
    </header>

    <main id="main-grid"></main>

    <div id="celebration-overlay">
        <div class="celeb-title">¡MOVIMIENTO!</div>
        <div class="celeb-name" id="celeb-name">AGENTE</div>
        <div class="celeb-detail" id="celeb-detail">+1</div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTS1nf-eEnd7l97a4WG0iXGQn_kqtc8kAkcSXUDiyMtoeXzLo-tmtycUl-cKFDjK2qaTi5JRanbWqG/pub?gid=0&single=true&output=csv';
        const FETCH_INTERVAL = 3000; 
        
        let memory = {}; 
        let isFirstRun = true; 
        let celebQueue = [];
        let isCeleb = false;
        
        // Umbral de paciencia (4 intentos = aprox 12 segundos antes de aceptar una bajada)
        const PERSISTENCE_THRESHOLD = 4; 

        async function init() {
            await fetchData();
            setInterval(fetchData, FETCH_INTERVAL);
            processQueue();
        }

        async function fetchData() {
            try {
                // Anti-Caché (Forzar datos frescos)
                const url = CSV_URL + '&t=' + Date.now();
                const response = await fetch(url);
                const text = await response.text();
                
                // Si la respuesta es HTML (Login), no intentamos parsear para evitar crash
                if (text.trim().startsWith("<!DOCTYPE")) { console.error("Error: Acceso Denegado al CSV"); return; }
                
                const agents = processData(text); 
                updateDashboard(agents);
            } catch (err) { console.error("...", err); }
        }

        function processData(csvText) {
            const lines = csvText.trim().split(/\r\n|\n/);
            const agents = [];

            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(',');
                if (row.length < 5) continue;

                const id = row[0].trim();
                const name = row[1].trim();
                let xfers = parseInt(row[2]) || 0; 
                let cp = parseInt(row[4]) || 0;    

                // Inicializar memoria COMPLETA si es nuevo
                if (!memory[id]) {
                    memory[id] = { 
                        xfers: xfers, 
                        cp: cp, 
                        highestXfers: xfers, // Récord histórico de hoy
                        highestCp: cp,       // Récord histórico de hoy
                        glitchCountXfer: 0,  
                        glitchCountCp: 0     
                    };
                } 
                
                const mem = memory[id];

                // ----------------------------------------------------
                // 1. BLINDAJE DE XFERS (Estabilización)
                // ----------------------------------------------------
                if (xfers < mem.xfers) {
                    if (xfers === 0) { // Reinicio
                        mem.xfers = 0; mem.highestXfers = 0; mem.glitchCountXfer = 0; 
                    } else { // Bajada sospechosa
                        mem.glitchCountXfer++;
                        if (mem.glitchCountXfer >= PERSISTENCE_THRESHOLD) {
                            mem.xfers = xfers; mem.glitchCountXfer = 0; // Aceptar
                        } else {
                            xfers = mem.xfers; // Ignorar (Mantener alto)
                        }
                    }
                } else {
                    mem.xfers = xfers; mem.glitchCountXfer = 0;
                }

                // ----------------------------------------------------
                // 2. BLINDAJE DE CP (IGUAL DE ESTRICTO)
                // ----------------------------------------------------
                if (cp < mem.cp) {
                    if (cp === 0) { // Reinicio
                        mem.cp = 0; mem.highestCp = 0; mem.glitchCountCp = 0; 
                    } else { // Bajada sospechosa
                        mem.glitchCountCp++;
                        if (mem.glitchCountCp >= PERSISTENCE_THRESHOLD) {
                            mem.cp = cp; mem.glitchCountCp = 0; // Aceptar
                        } else {
                            cp = mem.cp; // Ignorar (Mantener alto)
                        }
                    }
                } else {
                    mem.cp = cp; mem.glitchCountCp = 0;
                }

                // ----------------------------------------------------
                // 3. LÓGICA DE CELEBRACIÓN (CANDADO ANTI-REPETICIÓN)
                // ----------------------------------------------------
                
                // XFERS: Solo celebra si supera el récord histórico
                if (mem.xfers > mem.highestXfers) {
                    if (!isFirstRun) celebQueue.push({ name: name, text: '+1 XFER', mainColor: '#64ffda' });
                    mem.highestXfers = mem.xfers; 
                }

                // CP: Solo celebra si supera el récord histórico (CORREGIDO AQUÍ)
                if (mem.cp > mem.highestCp) {
                    if (!isFirstRun) celebQueue.push({ name: name, text: '+1 CP', mainColor: '#bd93f9' });
                    mem.highestCp = mem.cp; 
                }

                // Puntaje Maestro
                const masterScore = mem.xfers + (mem.cp * 0.001);
                agents.push({ id, name, xfers: mem.xfers, cp: mem.cp, masterScore });
            }
            
            if (isFirstRun) isFirstRun = false;
            return agents;
        }

        function updateDashboard(agents) {
            agents.sort((a, b) => b.masterScore - a.masterScore);
            const total = agents.reduce((sum, ag) => sum + ag.xfers, 0);
            document.getElementById('grand-total').innerText = total;

            // TOP 60 (15 Filas x 4 Columnas)
            const top60 = agents.slice(0, 60);
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            
            const cols = [document.createElement('div'), document.createElement('div'), document.createElement('div'), document.createElement('div')];
            cols.forEach(c => { c.className = 'column'; grid.appendChild(c); });

            top60.forEach((agent, i) => {
                const card = createCard(agent, i + 1);
                // Distribución 15 por columna
                if (i < 15) cols[0].appendChild(card);
                else if (i < 30) cols[1].appendChild(card);
                else if (i < 45) cols[2].appendChild(card);
                else cols[3].appendChild(card);
            });
        }

        function createCard(agent, rank) {
            const div = document.createElement('div');
            div.className = `agent-card rank-${rank}`;
            div.innerHTML = `
                <div class="rank">#${rank}</div>
                <div class="agent-info">
                    <div class="agent-name">${agent.name}</div>
                    <div class="agent-cp-display">CP: ${agent.cp}</div>
                </div>
                <div class="scores-container">
                    <div class="agent-score">${agent.xfers}</div>
                </div>
            `;
            return div;
        }

        // --- SISTEMA DE VELOCIDAD DINÁMICA ---
        function processQueue() {
            setInterval(() => {
                if (!isCeleb && celebQueue.length > 0) {
                    
                    // Velocidad según el tráfico
                    let duration = 3000; 
                    if (celebQueue.length > 5) duration = 500; // Flash
                    else if (celebQueue.length > 2) duration = 1500; // Rápido

                    const event = celebQueue.shift();
                    triggerCelebration(event, duration);
                }
            }, 100);
        }

        function triggerCelebration(event, duration) {
            isCeleb = true;
            const overlay = document.getElementById('celebration-overlay');
            const nameEl = document.getElementById('celeb-name');
            const detailEl = document.getElementById('celeb-detail');

            nameEl.innerText = event.name;
            nameEl.style.color = event.mainColor;
            nameEl.style.textShadow = `0 0 30px ${event.mainColor}`;
            detailEl.innerText = event.text;
            detailEl.style.color = event.mainColor;
            detailEl.style.borderColor = event.mainColor;
            detailEl.style.boxShadow = `0 0 20px ${event.mainColor} inset`;

            overlay.classList.add('active');
            
            const particleCount = duration < 1000 ? 50 : 150; 
            confetti({
                particleCount: particleCount,
                spread: 70,
                origin: { y: 0.6 },
                colors: [event.mainColor, '#ffffff'],
                disableForReducedMotion: true
            });

            setTimeout(() => {
                overlay.classList.remove('active');
                setTimeout(() => { isCeleb = false; }, 100);
            }, duration);
        }

        init();
    </script>
</body>
</html>
