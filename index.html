<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoreline - 60 Agents</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a192f;
            --accent-color: #64ffda;
            --cp-color: #bd93f9; /* Color morado para CP . */
            --text-color: #e6f1ff;
            --glass-bg: rgba(17, 34, 64, 0.8);
            --font-main: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER COMPACTO */
        header {
            height: 100px; /* Reducido para dar espacio a la tabla */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            background: rgba(10, 25, 47, 0.95);
            border-bottom: 2px solid var(--accent-color);
            z-index: 10;
        }

        .logo-container img { height: 60px; filter: drop-shadow(0 0 5px var(--accent-color)); }
        .dashboard-title { font-size: 1.8rem; font-weight: 800; letter-spacing: 3px; color: #fff; text-transform: uppercase;}
        
        .total-box { text-align: right; }
        .total-label { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }
        .total-value { font-size: 3rem; font-weight: 800; color: var(--accent-color); line-height: 1; }

        /* GRID DE 4 COLUMNAS */
        main {
            flex: 1;
            padding: 15px; /* Padding reducido */
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 Columnas iguales */
            gap: 15px;
            overflow: hidden;
        }

        .column { display: flex; flex-direction: column; gap: 8px; }

        /* TARJETA DE AGENTE COMPACTA */
        .agent-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            border-left: 3px solid rgba(100, 255, 218, 0.3);
            border-radius: 6px;
            padding: 8px 15px; /* Más compacto */
            height: 5vh; /* Altura relativa para ajustar 15 */
        }

        .rank { font-size: 1.1rem; font-weight: 800; width: 35px; color: rgba(255,255,255,0.4); }
        
        .agent-info { flex: 1; overflow: hidden; white-space: nowrap; }
        .agent-name { font-size: 1rem; font-weight: 700; color: #fff; text-overflow: ellipsis; overflow: hidden; }
        .agent-id { font-size: 0.7rem; color: #8892b0; }

        .scores-container { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .agent-score { font-size: 1.4rem; font-weight: 800; color: var(--accent-color); line-height: 1;}
        
        /* Estilo para el CP pequeño . */
        .agent-cp { 
            font-size: 0.7rem; 
            color: var(--cp-color); 
            font-weight: 600; 
            margin-top: -2px;
        }
        .agent-cp::after { content: ' CP'; opacity: 0.7;}

        /* TOP 3 HIGHLIGHTS */
        .rank-1 { background: rgba(100, 255, 218, 0.15); border-left: 3px solid #ffd700; }
        .rank-2 { background: rgba(100, 255, 218, 0.10); border-left: 3px solid #c0c0c0; }
        .rank-3 { background: rgba(100, 255, 218, 0.05); border-left: 3px solid #cd7f32; }

        .rank-1 .rank { color: #ffd700; }
        
        /* OVERLAY DE CELEBRACIÓN */
        #celebration-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 25, 47, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 100;
        }
        #celebration-overlay.active { opacity: 1; }
        .celeb-title { font-size: 2rem; color: #fff; letter-spacing: 5px; margin-bottom: 20px;}
        .celeb-name { font-size: 5rem; color: var(--accent-color); font-weight: 800; text-shadow: 0 0 30px var(--accent-color); margin-bottom: 10px; text-align: center;}
        .celeb-type { font-size: 2.5rem; color: #fff; background: rgba(255,255,255,0.1); padding: 10px 30px; border-radius: 50px;}

    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="Shoreline.ico" alt="Logo" onerror="this.style.display='none'">
            <span class="dashboard-title">SHORELINE</span>
        </div>
        <div class="total-box">
            <div class="total-label">TOTAL XFERS</div>
            <div class="total-value" id="grand-total">0</div>
        </div>
    </header>

    <main id="main-grid">
        </main>

    <div id="celebration-overlay">
        <div class="celeb-title">¡MOVIMIENTO REGISTRADO!</div>
        <div class="celeb-name" id="celeb-name">NOMBRE</div>
        <div class="celeb-type" id="celeb-detail">+1 XFER</div>
    </div>

    <script>
        // CONFIGURACIÓN
        // 1. REEMPLAZA ESTA URL CON TU NUEVO LINK CSV (El que tiene las columnas A-G)
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTS1nf-eEnd7l97a4WG0iXGQn_kqtc8kAkcSXUDiyMtoeXzLo-tmtycUl-cKFDjK2qaTi5JRanbWqG/pub?gid=0&single=true&output=csv';
        
        const FETCH_INTERVAL = 5000;
        let previousData = {}; // Para guardar Xfers y CP anteriores

        async function init() {
            await fetchData();
            setInterval(fetchData, FETCH_INTERVAL);
            processQueue();
        }

        async function fetchData() {
            try {
                const response = await fetch(CSV_URL);
                const text = await response.text();
                const agents = parseCSV(text);
                updateDashboard(agents);
            } catch (err) { console.error(err); }
        }

        function parseCSV(csvText) {
            const lines = csvText.trim().split(/\r\n|\n/);
            const agents = [];
            
            // Asumimos estructura nueva: 
            // 0:ID, 1:Agente, 2:Xfers, 3:Check, 4:CP, 5:CheckCP, 6:Email
            
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(',');
                if (row.length < 5) continue; // Protección básica

                const id = row[0].trim();
                const name = row[1].trim();
                const xfers = parseInt(row[2]) || 0; // Columna C
                const cp = parseInt(row[4]) || 0;    // Columna E (Indice 4)

                // Calcular Puntaje Maestro para ordenamiento (Xfers vale 1, CP vale 0.01)
                const masterScore = xfers + (cp * 0.01);

                agents.push({ id, name, xfers, cp, masterScore });
            }
            return agents;
        }

        function updateDashboard(agents) {
            // 1. ORDENAMIENTO (Desempate por CP)
            agents.sort((a, b) => b.masterScore - a.masterScore);

            // 2. TOTAL GLOBAL
            const total = agents.reduce((sum, ag) => sum + ag.xfers, 0);
            document.getElementById('grand-total').innerText = total;

            // 3. DETECTAR CAMBIOS (Para animación)
            checkChanges(agents);

            // 4. RENDER GRID (Top 60 - 4 Columnas x 15)
            const top60 = agents.slice(0, 60);
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';

            const cols = [document.createElement('div'), document.createElement('div'), document.createElement('div'), document.createElement('div')];
            cols.forEach(c => { c.className = 'column'; grid.appendChild(c); });

            top60.forEach((agent, i) => {
                const card = createCard(agent, i + 1);
                
                // Distribución 15 por columna
                if (i < 15) cols[0].appendChild(card);
                else if (i < 30) cols[1].appendChild(card);
                else if (i < 45) cols[2].appendChild(card);
                else cols[3].appendChild(card);
            });
        }

        function createCard(agent, rank) {
            const div = document.createElement('div');
            div.className = `agent-card rank-${rank}`;
            div.innerHTML = `
                <div class="rank">#${rank}</div>
                <div class="agent-info">
                    <div class="agent-name">${agent.name}</div>
                    <div class="agent-id">ID: ${agent.id}</div>
                </div>
                <div class="scores-container">
                    <div class="agent-score">${agent.xfers}</div>
                    ${agent.cp > 0 ? `<div class="agent-cp">${agent.cp}</div>` : ''}
                </div>
            `;
            return div;
        }

        // --- SISTEMA DE CELEBRACIÓN ---
        let celebQueue = [];
        let isCeleb = false;

        function checkChanges(agents) {
            agents.forEach(ag => {
                const prev = previousData[ag.id] || { xfers: 0, cp: 0 };
                
                // Detectar XFER
                if (ag.xfers > prev.xfers) {
                    celebQueue.push({ name: ag.name, type: 'XFER', color: '#64ffda' });
                }
                // Detectar CP (Opcional: Si quieres celebrar CPs también)
                else if (ag.cp > prev.cp) {
                    celebQueue.push({ name: ag.name, type: 'CP', color: '#bd93f9' });
                }

                previousData[ag.id] = { xfers: ag.xfers, cp: ag.cp };
            });
        }

        function processQueue() {
            setInterval(() => {
                if (!isCeleb && celebQueue.length > 0) {
                    showCeleb(celebQueue.shift());
                }
            }, 500);
        }

        function showCeleb(data) {
            isCeleb = true;
            const ov = document.getElementById('celebration-overlay');
            document.getElementById('celeb-name').innerText = data.name;
            
            const detail = document.getElementById('celeb-detail');
            detail.innerText = `+1 ${data.type}`;
            detail.style.color = data.color;
            detail.style.borderColor = data.color;

            ov.classList.add('active');
            
            // Confeti del color correspondiente
            confetti({ particleCount: 150, spread: 70, colors: [data.color, '#ffffff'] });

            setTimeout(() => {
                ov.classList.remove('active');
                isCeleb = false;
            }, 4000);
        }

        init();
    </script>
</body>
</html>
